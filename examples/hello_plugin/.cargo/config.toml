# Локальный конфиг WASM-сборки модуля.
#
# Глобальный ~/.cargo/config.toml добавляет всем сборкам
#   rustflags = ["-C", "link-arg=-fuse-ld=lld"]
# что ломает rust-lld для wasm32 (gcc-style аргумент в wasm-flavor lld).
#
# Пустой массив здесь НЕ работает: cargo считает его «не задано»
# и проваливается к глобальному значению. Поэтому переопределяем
# target-scoped rustflags РЕАЛЬНЫМ содержимым — приоритет
# target.<triple>.rustflags выше build.rustflags, источник меняется целиком.
#
# linker: тот же rust-lld, явно — чтобы конфиг был самодостаточным.
[target.wasm32-unknown-unknown]
linker = "rust-lld"
rustflags = ["-C", "debuginfo=0"]
