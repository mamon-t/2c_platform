[package]
name = "twoplat"
version = "0.0.1"
description = "2C Platform — конфигурируемая документо-событийная платформа"
authors = ["Миха Алексеев"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

tokio = { version = "1", features = ["full"] }
mongodb = "3.2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

rhai = "1.20"
jsonwebtoken = "9"
argon2 = "0.5"
rand = "0.8"
async-trait = "0.1"

thiserror = "2"
extism = "1.4"
handlebars = "6"
dotenvy = "0.15"
