[workspace]
resolver = "2"
members = [
    "crates/core-domain",
    "crates/core-application",
    "crates/core-infrastructure",
    "crates/core-api",
    "apps/platform-server",
]
exclude = [
    "examples/hello_plugin",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Миха Алексеев"]
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.53", features = ["full"] }

# Web framework
axum = { version = "0.8", features = ["ws", "macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Database
surrealdb = { version = "3.2", features = ["protocol-ws"] }

# WASM
extism = "1.30"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utils
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"